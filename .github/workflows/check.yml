name: Kiểm tra sổ tay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check reader.js
      - run: node --test tools/*.test.mjs
      - run: node tools/validate-public-data.mjs
